eureka: 
   client:
      register-with-eureka: true
      fetch-registry: true
      service-url: 
       defaultZone: http://localhost:8761/eureka/
   instance:
    hostname: localhost  

npe:
  attributes:
    miOtherNpeAttrs:
      Device:
        battery: "DEVICE_BATTERY_STATUS"
        config: "DEVICE_CONFIGURATION"
      Rack:
        battery: "RACK_BATTERY_STATUS"  
        config: "RACK_CONFIGURATION"
