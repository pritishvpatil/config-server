      softwareVersion: S/W VERSION
      sheathId: SHEATH ID
      bitRate: BIT_RATE

    Item:
      batteryType: BATTERY_TYPE
      config: CONFIG
      name: ELEMENT ID
      comments: EPS_NOTES
      firmwareVersion: F/W VERSION
      receiveFrequency: FREQUENCY RX
      hardwareRevision: H/W REVISION
      memoryBank1: MEMORY BANK 1
      memoryBank2: MEMORY BANK 2
      pgsId: PGS ID
      release: RELEASE
      softwareProductionStatus: S/W PROD STATUS
      softwareVersion: S/W VERSION
      sheathId: SHEATH ID

    Drawer:
      hardwareRevision: H/W REVISION
