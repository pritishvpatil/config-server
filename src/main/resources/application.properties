# Eureka Configuration Properties
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Network Configuration
app.network.hostname=localhost
app.network.eureka.port=8761
app.network.protocol=http://
app.network.eureka.path=/eureka/

# Application Constants
app.constants.eureka.default-zone-url=${app.network.protocol}${app.network.hostname}:${app.network.eureka.port}${app.network.eureka.path}